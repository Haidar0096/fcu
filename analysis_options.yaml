# Run: dart analyze
include: package:very_good_analysis/analysis_options.7.0.0.yaml

analyzer:
  exclude:
    # Agent scratchpad, not project code.
    - .iai/scratchpad/**
    # Generated by build_version; never hand-edited.
    - lib/src/version.dart

linter:
  rules:
    # This is an application, not a published package: its public members are
    # not an API other people read docs for.
    public_member_api_docs: false
    # Licenses the typed-arm-plus-bare-last-resort catch shape the house uses
    # at the process and network seams.
    avoid_catches_without_on_clauses: false
