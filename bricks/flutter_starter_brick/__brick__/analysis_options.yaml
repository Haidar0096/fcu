# Run: dart analyze
# The architecture plugin below fires under `dart analyze` only; `flutter analyze`
# runs no analyzer plugin on Flutter 3.44.9 / Dart 3.12.2 (measured).

include: package:very_good_analysis/analysis_options.yaml

plugins:
  architecture_lint_rules:
    path: packages/architecture_lint_rules

analyzer:
  errors:
    # This is an app, not a published package: its public members are internal
    # to the app, so a document-everything list would be noise.
    public_member_api_docs: ignore
    # Licenses the house catch shape: typed `on` arms first, then one bare
    # last-resort `catch` so nothing escapes unlogged.
    avoid_catches_without_on_clauses: ignore
  exclude:
    - lib/**/*.g.dart
    - packages/architecture_lint_rules/**
    - .iai/scratchpad/**
