# Run: dart run flutter_launcher_icons

flutter_launcher_icons:

  android: "launcher_icon"
  image_path_android: "assets/images/app_icon/app_icon.png"
  min_sdk_android: 21 # android min sdk min:16, default 21
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: "assets/images/app_icon/app_icon.png"
  adaptive_icon_monochrome: "assets/images/app_icon/app_icon.png"

  ios: true
  image_path_ios: "assets/images/app_icon/app_icon.png"
  remove_alpha_ios: true

  web:
    generate: true
    image_path: "assets/images/app_icon/app_icon.png"
    background_color: "#FFFFFF"
    theme_color: "#000000"

  windows:
    generate: true
    image_path: "assets/images/app_icon/app_icon.png"
    icon_size: 48 # min:48, max:256, default: 48

  macos:
    generate: true
    image_path: "assets/images/app_icon/app_icon.png"
