{{=<% %>=}}
name: Checks

# The PR gate: format, analyze, tests and build must all be green before any
# merge into a protected branch. It runs the code-check gate in the same order
# the agent runs it locally, on the same pinned Flutter version.

on:
  pull_request:
  push:
    branches:
      - development
      - production

jobs:
  setup:
    uses: ./.github/workflows/setup-common-config.yml

  checks:
    name: Format, analyze, test & build
    needs: setup
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6.0.2

      - name: Set up Flutter
        uses: subosito/flutter-action@v2.21.0
        with:
          flutter-version: ${{ needs.setup.outputs.FLUTTER_VERSION }}

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Run build_runner
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        # analysis_options.yaml wires the architecture lint plugin through a
        # `git:` source. Two separate facts, both measured on Flutter 3.44.9 /
        # Dart 3.12.2:
        #   1. The plugin itself now WORKS, and its findings are fatal.
        #      `dart analyze` on a generated app carrying deliberate breaches
        #      and NO other issue reported five architecture warnings across
        #      four rules and exited 2 — the plugin's warnings alone stop the
        #      command.
        #      A second run carrying one breach per rule made all ELEVEN rules
        #      report. With every probe removed the same command reported
        #      nothing and exited 0.
        #   2. `flutter analyze` surfaces NO analyzer-plugin diagnostic at
        #      all. On the five-breach tree it answered `No issues found!` and
        #      exited 0. On the eleven-breach tree it reported only the
        #      ordinary `unused_import` and `directives_ordering` issues from
        #      the very same probe files — not one architecture rule. The LSP
        #      traffic log shows the plugin loading and being handed the
        #      context root, and no `publishDiagnostics` for its findings.
        #      That gap is upstream, not in this project.
        # So this step remains the very_good_analysis gate; the architecture
        # rules are enforced by `dart analyze` (and by review). Whether this
        # gate should switch to, or gain, a `dart analyze` step is an open
        # question for the project owner. Nobody has measured an IDE, so
        # nothing here claims one.
        run: flutter analyze

      - name: Analyze (architecture rules)
        # The architecture rules are gated HERE. `flutter analyze` surfaces no
        # analyzer-plugin diagnostic on the pinned toolchain (measured — see
        # the comment above), while `dart analyze` fails on any plugin
        # warning: five deliberate breaches → exit 2; the clean generated app
        # → exit 0. Both measured on Flutter 3.44.9 / Dart 3.12.2.
        run: dart analyze

      - name: Run tests
        # `flutter test` exits non-zero on a project that has no `test/` folder,
        # so the guard keeps the gate honest until the first test lands.
        run: |
          if [ -d test ]; then
            flutter test
          else
            echo "No test/ directory in this project yet - nothing to run."
          fi

      - name: Build
        # The cheapest real build: it compiles the app's Dart program for the
        # native target. `fcu create` picks each project's platforms, so the
        # gate builds no platform in particular - this command needs no
        # platform folder at all. It does NOT cover a platform's own
        # toolchain: a web project adds `flutter build web` here (the web
        # compiler is the only thing that catches a `dart:io` import), and an
        # Android or iOS target adds its build plus, for Android, the Java
        # setup step the deploy lane carries.
        #
        # The `-t` target below names one environment, because
        # `flutter build bundle` otherwise defaults to `lib/main.dart`, which
        # this project does not ship. A project that renames or drops the
        # `development` environment updates this one line to an entry point it
        # really has, or the gate goes red for a reason unrelated to its code.
        run: flutter build bundle -t lib/main_development.dart
