name: {{proj_name}}
description: {{proj_desc}}
publish_to: 'none'
# Dummy. The shipped version lives in the `versions` file at the project root,
# which the release scripts and the CI workflows read.
version: 0.1.0

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/common/
  fonts: # TODO({{dev_name.paramCase()}}): use your own fonts if needed
    - family: montserrat
      fonts:
        - asset: assets/fonts/montserrat_bold.ttf
          weight: 700
        - asset: assets/fonts/montserrat_italic.ttf
          style: italic
        - asset: assets/fonts/montserrat_regular.ttf
