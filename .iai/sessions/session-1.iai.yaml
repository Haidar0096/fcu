corrections:
- what_went_wrong: Phase 1 classified outer IAI.md 'brick-output' sections as drop-safe based on inspecting the brick's __brick__/IAI.md HEADERS only, not bodies. Advisor flagged that 10 sections existed only in the outer copy and would be silently lost if the brick's body did not actually cover them. Required writing a phase2_brick_migration.md handoff note as a save before any git rm.
  lesson: When migrating content across two related sources (e.g. outer project + template/copy), do not classify based on topic structure (heading match) alone. Cross-check the bodies — the same heading in the other source can have different content. If you cannot afford a full body diff, write a handoff note enumerating the dropped sections so the next migration step can verify before deletion.
  disposition: null
- what_went_wrong: Initially shipped the brick template's new __brick__/.iai/startup/cat.sh without any post-render chmod, assuming Mason would preserve the executable bit. Render test showed Mason renders all files with default perms (-rw-r--r--), so the kernel walker (which checks `[ -x cat.sh ]`) silently skipped the rendered project's rules. Required adding a chmod step to post_gen.dart as the first action.
  lesson: Mason does NOT preserve file mode (executable bit). Any brick that ships a script that must be executable in the rendered project — `.sh` files, hooks, IAI cat.sh, etc. — needs a chmod step in post_gen.dart, OR the consumer must invoke the script via `bash $path` rather than `$path` directly. Verify with a render test before declaring the brick correct.
  disposition: null
- what_went_wrong: Did not create an IAI session at the start of the legacy_rescue migration. The /iai-migrate skill drove the work directly, and a session was only created retroactively at save time when the user asked to persist state. The session therefore has no STEP 1 outputs, no plan-approved gate passing, no test/advisor records — workflow.current_step is the default.
  lesson: Even when a skill (like iai-migrate or iai-system) drives the work without explicitly walking the kernel STEPs, an IAI session should still be created at the start so the work is durable from minute one. If the skill itself does not create the session, create one manually after the skill's pre-checks but before any substantive mutation. A session created retroactively at save time loses the gate evidence (STEP 1 approvals, advisor stamp, test stamp).
  disposition: null
